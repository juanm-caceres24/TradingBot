[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.8.0"
description = "Zero-dependency multi-asset market data collector, indicator engine, neural-network forecasting client, alert API, and 24/7 web dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
